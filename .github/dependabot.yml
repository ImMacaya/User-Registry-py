version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    target-branch: "main"
    open-pull-requests-limit: 5

    # Group minor and patch dependency updates.
    groups:
      python-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Apply labels to dependency pull requests.
    labels:
      - "dependencies"

    # Use conventional commit messages.
    commit-message:
      prefix: "chore"
      include: "scope"
